name: CGL-LF validation

on:
  pull_request:
    branches: [CGL-STS-LF]
  push:
    branches: [c/cgl-lf-wo1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgl-lf-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: cpu
            mpi: "OFF"
          - mode: mpicpu
            mpi: "ON"
    env:
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopenmpi-dev openmpi-bin
          python -m pip install numpy matplotlib pytest
      - name: Build CGL Linux application
        shell: bash
        run: |
          cmake -S . -B tst/build -DCMAKE_BUILD_TYPE=Release -DAthena_ENABLE_MPI=${{ matrix.mpi }}
          cmake --build tst/build -j 2
          ln -s ../../inputs tst/build/src/inputs
      - name: Run CGL Linux tests
        shell: bash
        run: |
          cd tst
          python - <<'PY'
          import os
          import pytest
          import test_suite.testutils
          os.chdir("build/src")
          status = pytest.main([
              "../../test_suite/cgl", "-k", "_${{ matrix.mode }}",
              "-q", "--junitxml=../../cgl-${{ matrix.mode }}.xml",
          ])
          if status == 0 and "${{ matrix.mode }}" == "cpu":
              status = pytest.main([
                  "../../test_suite/cgl/test_cgl_amr_gpu.py::test_cgl_lf_amr_3d_churn_gpu",
                  "../../test_suite/cgl/test_cgl_amr_gpu.py::test_cgl_lf_amr_primitive_churn_gpu",
                  "../../test_suite/cgl/test_cgl_amr_gpu.py::test_cgl_amr_restart_through_regrid_gpu",
                  "-q", "--junitxml=../../cgl-amr.xml",
              ])
          raise SystemExit(status)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cgl-${{ matrix.mode }}-results
          path: |
            tst/cgl-*.xml
            tst/test_log.txt

  cuda-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Compile device kernels without claiming a GPU runtime test on this runner.
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu24.04@sha256:392c0df7b577ecae17a17f6ba7f2009c217bb4422f8431c053ae9af61a8c148a
    steps:
      - name: Install compiler prerequisites
        run: |
          apt-get update
          apt-get install -y ca-certificates cmake g++ git
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Compile CUDA device kernels
        shell: bash
        run: |
          nvcc --version
          cmake -S . -B build-cuda -DCMAKE_BUILD_TYPE=Release \
            -DKokkos_ENABLE_CUDA=ON -DKokkos_ARCH_AMPERE80=ON \
            -DCMAKE_CXX_COMPILER="$GITHUB_WORKSPACE/kokkos/bin/nvcc_wrapper" \
            2>&1 | tee cuda-configure.log
          cmake --build build-cuda -j 2 2>&1 | tee cuda-build.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cgl-cuda-compile-logs
          path: cuda-*.log
